<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination Result</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="result-body">

    <div class="result-container">

        <h1>Examination Result</h1>

        <h2 id="resultName">Student Name</h2>
        <p id="resultRoll">Roll Number</p>

        <div class="score-box">
            <p>Your Score</p>
            <h1 id="score">0 / 10</h1>
            <h2 id="percentage">0%</h2>
        </div>

        <div class="result-details">

            <div>
                <h2 id="correct">0</h2>
                <p>Correct Answers</p>
            </div>

            <div>
                <h2 id="wrong">0</h2>
                <p>Wrong Answers</p>
            </div>

            <div>
                <h2 id="unanswered">0</h2>
                <p>Unanswered</p>
            </div>

        </div>

        <h2 id="status"></h2>

        <a href="index.html" class="primary-btn">
            Back to Home
        </a>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
